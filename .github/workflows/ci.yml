name: Alashry CI

on:
  push:
    branches: [main, professional-v5-upgrade, bilingual-superadmin-settings]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Generate Prisma client
        run: npm --prefix backend run db:generate -- --schema=prisma/schema.prisma
      - name: Check backend JavaScript syntax
        run: find backend/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build frontend
        run: npm run build --prefix frontend
